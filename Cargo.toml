[workspace]
resolver = "3"
members = [
    "crates/wire-proto",
    "crates/identity",
    "crates/storage",
    "crates/crypto-session",
    "crates/net",
    "crates/audio",
    "crates/core",
    "crates/directory-server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
wire-proto = { path = "crates/wire-proto" }
identity = { path = "crates/identity" }
storage = { path = "crates/storage" }
crypto-session = { path = "crates/crypto-session" }
net = { path = "crates/net" }
audio = { path = "crates/audio" }
p2p-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
bincode = "1"

[profile.release]
lto = "thin"
strip = true

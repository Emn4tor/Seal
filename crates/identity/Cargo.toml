[package]
name = "identity"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wire-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true

vodozemac = "0.10"
keyring = "4"
rand = "0.8"
base64 = "0.22"
zeroize = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"

# Bypasses `keyring` on macOS specifically, to gate the KEK behind Touch ID
# (`kSecAccessControlUserPresence`) — `keyring`'s macOS backend goes through
# the legacy, deprecated `SecKeychainAddGenericPassword` API and has no way
# to attach a `SecAccessControl`. Already a transitive dependency via
# `keyring` on this platform, so this doesn't add a new library to the
# build, just a direct path to APIs `keyring` doesn't expose.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

# `keyring`'s default features pull in `apple-native-keyring-store` for both
# macOS and iOS, but that crate hard-requires its own `protected` feature
# specifically on iOS (a `compile_error!` otherwise) — iOS doesn't support
# the plain, non-"protected" generic-keychain-item storage class the way
# macOS does. This doesn't change which code path `Keychain` actually uses
# on iOS (still the ordinary `keyring::Entry` API in `keychain.rs`'s
# `not(macos)` branch, same as Linux/Windows/Android); it just satisfies
# apple-native-keyring-store's own build-time requirement, the same way the
# macOS `security-framework` dependency above reaches into an already-
# transitive crate for one specific capability.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
# `keyring`'s own default-store wiring (its `v1` compat layer) only calls
# `keyring_core::set_default_store` on macOS/Windows/non-Apple Unix — its
# cfg gate excludes iOS on purpose, since the "protected" store needs an
# app-specific `Store::new()` call the generic layer can't make for you.
# Without this, every `keyring::Entry::new(...)` on iOS fails with
# `NoDefaultStore`, so `Keychain` has to set the store itself before
# creating any entry; that requires calling `keyring_core::set_default_store`
# directly, hence this otherwise-transitive crate becoming a direct one.
keyring-core = "1"

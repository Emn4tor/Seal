[package]
name = "net"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wire-proto.workspace = true
identity.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "quic",
    "dns",
    "noise",
    "yamux",
    "identify",
    "relay",
    "dcutr",
    "gossipsub",
    "request-response",
    "cbor",
    "ping",
    "autonat",
    "macros",
] }
# Not gated behind a `libp2p` umbrella feature in 0.56 — added directly.
# Gives plain per-peer duplex byte streams over the existing swarm/transport,
# for continuous voice audio (request_response is discrete request->response,
# gossipsub is broadcast; neither fits a call).
libp2p-stream = "0.4.0-alpha"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
rand = "0.8"
bincode.workspace = true
# Both already transitive dependencies via `vodozemac` (used by `identity`/
# `crypto-session`) at these exact versions — added directly here rather
# than pulling in a new library, same reasoning as `identity`'s
# `security-framework` dependency. Used only for the pairing handshake's
# app-layer ECDH-wrapped encryption on top of the already-Noise-encrypted
# transport (defense in depth for a device certificate + account bootstrap
# data, consistent with how every other sensitive payload in this app gets
# Olm/Megolm on top of Noise rather than relying on the transport alone).
x25519-dalek = { version = "2", features = ["getrandom"] }
chacha20poly1305 = "0.10"

[dev-dependencies]
tracing-subscriber = { workspace = true }
directory-server = { path = "../directory-server" }
axum = "0.8"
tempfile = "3"

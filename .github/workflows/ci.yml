name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` sets `rustc-wrapper = "sccache"` for local dev
  # speed — CI runners don't have sccache installed (and, being ephemeral,
  # wouldn't get much benefit from it without also wiring up a persistent
  # cache backend for it), so every `cargo` invocation would otherwise fail
  # immediately with "could not execute process `sccache ...`". This
  # env-var override beats the config file without needing to touch it,
  # same fix `scripts/setup-backend.sh` already applies for the same
  # reason on a local machine that has the wrapper configured but not
  # installed. `Swatinem/rust-cache@v2` below already covers the actual
  # caching need for CI.
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # `apps/desktop/src-tauri` is a workspace member, so `cargo test`/
      # `clippy` below already compile the actual Tauri app on each OS, not
      # just the platform-independent crates — this is the whole reason to
      # run this job as a matrix instead of macOS-only: it's the only thing
      # that would ever catch a Windows/Linux-specific compile error (tray
      # icon, autostart, WebView2/WebKitGTK differences, ...).
      - name: install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config \
            libasound2-dev gnome-keyring dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        if: runner.os != 'Linux'
        run: cargo test --workspace
      # `identity::Keychain` (and so `AppService::load_or_create`, used
      # throughout `crates/core`'s integration tests) goes through the
      # cross-platform `keyring` crate here, which needs a real D-Bus
      # Secret Service to talk to — present on an actual Linux desktop
      # session, but not on a bare CI runner, where it fails outright with
      # "No default store has been set". `dbus-run-session` + an unlocked
      # `gnome-keyring-daemon` stands one up for just this step, matching
      # what a real Linux desktop actually provides rather than skipping
      # every test that happens to touch identity storage.
      - name: test (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            eval "$(echo -n "" | gnome-keyring-daemon --unlock --components=secrets)"
            # `eval` above returns as soon as gnome-keyring-daemon has forked
            # and printed its env vars, not once it has actually finished
            # registering the secret-service D-Bus name — a real, if brief,
            # startup race. It bit the `identity` crate'\''s own dedicated
            # keychain test specifically because that test binary is small
            # enough to start running within milliseconds of this step,
            # before the daemon caught up (NoStorageAccess/NoResult) — every
            # *other* crate touching the same keychain (p2p-core'\''s, much
            # larger and slower to build) had plenty of incidental time to
            # not hit it, which is why this looked inconsistent rather than
            # totally broken.
            sleep 2
            cargo test --workspace
          '
      # Platform-independent (an advisory-DB lookup against Cargo.lock), so
      # only run once rather than installing cargo-audit on all three.
      - name: install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-audit --locked
      - name: audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

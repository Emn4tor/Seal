[package]
name = "desktop"
version = "1.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

p2p-core.workspace = true
storage.workspace = true
identity.workspace = true
directory-server = { path = "../../../crates/directory-server" }
tokio = { workspace = true, features = ["net", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
axum = "0.8"
rand = "0.8"
base64 = "0.22"

# Attachments: strip/read EXIF, guess MIME types from file extensions.
img-parts = "0.4"
bytes = "1"
kamadak-exif = "0.6"
mime_guess = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
# Only to generate a real, valid test-fixture JPEG in the EXIF-strip test.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"


name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles dmg,app'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
    
      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev fuse libasound2-dev

      - name: Install JavaScript dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # `.cargo/config.toml` sets `rustc-wrapper = "sccache"` for local
          # dev speed — this runner doesn't have sccache installed, so the
          # `cargo build` this step runs (via `tauri-action` -> `npm run
          # tauri build`) would otherwise fail immediately with "could not
          # execute process `sccache ...`". Overriding it here beats the
          # config file without touching it — same fix as `ci.yml`'s `rust`
          # job, see that env block's comment for the full reasoning.
          CARGO_BUILD_RUSTC_WRAPPER: ""
        with:
          projectPath: ./apps/desktop
          args: ${{ matrix.args }}
          releaseDraft: true
          prerelease: false
